spring.application.name=inventory-service
server.port=8081

spring.datasource.url=${INVENTORY_DB_URL:jdbc:postgresql://localhost:5434/inventorydb}
spring.datasource.username=${INVENTORY_DB_USER:inventory_user}
spring.datasource.password=${INVENTORY_DB_PASSWORD:inventory_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
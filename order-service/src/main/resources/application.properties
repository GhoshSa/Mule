spring.application.name=order-service
server.port=8080

spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5433/orderdb}
spring.datasource.username=${ORDER_DB_USER:order_user}
spring.datasource.password=${ORDER_DB_PASSWORD:order_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

inventory.service.base-url=${INVENTORY_SERVICE_URL:http://localhost:8081}
payment.service.base-url=${PAYMENT_SERVICE_URL:http://localhost:8082}